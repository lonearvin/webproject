services:
  webproject:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    # 仅挂载配置目录到容器内的 /app/config（核心修复）
    volumes:
      - ./config:/app/config
      - ./templates:/app/templates
      - ./static:/app/static
      - ./log:/app/log
    restart: unless-stopped
